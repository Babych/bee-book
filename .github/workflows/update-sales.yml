name: Update Book Sales from Monobank

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-sales:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch Monobank Jar
        env:
          MONOAPI: ${{ secrets.MONOAPI }}
          MONO_TOKEN: ${{ secrets.MONO_TOKEN }}
        run: python update_stats.py

      - name: Commit stats
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add stats.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update sales [skip ci]" && git push)